/notifications:
  get:
    summary: List current user notifications
    tags: [Notifications]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: type
        schema:
          type: string
          enum: [new_movie, showtime_alert, review_request]
      - in: query
        name: unreadOnly
        schema:
          type: boolean
    responses:
      200:
        description: Notifications list

/notifications/unread-count:
  get:
    summary: Number of unread notifications
    tags: [Notifications]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Unread count

/notifications/read-all:
  patch:
    summary: Mark all notifications as read
    tags: [Notifications]
    security:
      - bearerAuth: []
    responses:
      200:
        description: All marked as read

/notifications/{id}/read:
  patch:
    summary: Mark a notification as read
    tags: [Notifications]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Marked as read

/notifications/subscription:
  get:
    summary: Get new-movie notification subscription status
    tags: [Notifications]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Subscription status
  put:
    summary: Subscribe or unsubscribe to new-movie notifications
    tags: [Notifications]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subscribed]
            properties:
              subscribed:
                type: boolean
    responses:
      200:
        description: Subscription updated
