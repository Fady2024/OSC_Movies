/auth/register:
  post:
    summary: Register new user
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fullName, email, password]
            properties:
              fullName:
                type: string
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 6
    responses:
      201:
        description: User registered
      409:
        description: Email already exists

/auth/login:
  post:
    summary: Login and get JWT
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
    responses:
      200:
        description: Login successful
      401:
        description: Invalid credentials

/auth/refresh:
  post:
    summary: Refresh access token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken:
                type: string
    responses:
      200:
        description: Token refreshed
      401:
        description: Invalid refresh token

/auth/forgot-password:
  post:
    summary: Request password reset
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
    responses:
      200:
        description: Reset link sent

/auth/reset-password:
  post:
    summary: Reset password with token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, newPassword]
            properties:
              token:
                type: string
              newPassword:
                type: string
                minLength: 6
    responses:
      200:
        description: Password reset successful
      400:
        description: Invalid or expired token

/auth/me:
  get:
    summary: Get current user profile
    tags: [Auth]
    security:
      - bearerAuth: []
    responses:
      200:
        description: User profile
      401:
        description: Unauthorized

/auth/account:
  delete:
    summary: Deactivate account
    tags: [Auth]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Account deactivated
      401:
        description: Unauthorized
