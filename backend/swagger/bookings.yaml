/bookings:
  post:
    summary: Create a new booking
    tags: [Bookings]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [showtimeId, seats]
            properties:
              showtimeId:
                type: string
              seats:
                type: array
                items:
                  type: number
    responses:
      201:
        description: Booking created
      409:
        description: Seats already reserved

/bookings/my:
  get:
    summary: Get current user bookings
    tags: [Bookings]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
    responses:
      200:
        description: User bookings list

/bookings/{id}:
  get:
    summary: Get booking details
    tags: [Bookings]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Booking details
      404:
        description: Booking not found

/bookings/{id}/seats:
  patch:
    summary: Change seats while preserving ticket count
    tags: [Bookings]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seats]
            properties:
              seats:
                type: array
                items:
                  type: number
    responses:
      200:
        description: Seats updated

/bookings/{id}/cancel:
  patch:
    summary: Cancel booking
    tags: [Bookings]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Booking cancelled
