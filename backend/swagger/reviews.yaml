/movies/{id}/reviews:
  get:
    summary: List reviews with rating distribution
    tags: [Reviews]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
    responses:
      200:
        description: Reviews with rating distribution
  post:
    summary: Create a review (attendance required)
    tags: [Reviews]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [rating, comment]
            properties:
              rating:
                type: integer
                minimum: 1
                maximum: 10
              comment:
                type: string
    responses:
      201:
        description: Review created
      403:
        description: Not attended
      409:
        description: Already reviewed

/movies/{id}/reviews/me:
  get:
    summary: Get current user review for a movie
    tags: [Reviews]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: User review
      404:
        description: No review found

/reviews/{id}:
  patch:
    summary: Update own review
    tags: [Reviews]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              rating:
                type: integer
                minimum: 1
                maximum: 10
              comment:
                type: string
    responses:
      200:
        description: Review updated
      403:
        description: Not owner
  delete:
    summary: Delete own review
    tags: [Reviews]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Review deleted
      403:
        description: Not owner
